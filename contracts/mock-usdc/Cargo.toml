[package]
name = "mock-usdc"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Test USDC: a NEP-141 token with 6 decimals and a public mint capped at 500 per account per day. Testnet only."

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
