[package]
name = "commish"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Commish: league dues in a Sputnik DAO vault, payouts computed by an attested OutLayer job."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
settle-core = { path = "../../crates/settle-core", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = { version = "0.23.0", features = ["unstable"] }
# near-crypto 0.37 (from near-sdk's unit-testing feature) pins aws-lc-rs = 1.16.2, and rustls
# 0.23.46 needs aws-lc-rs ^1.18. rustls 0.23.40 accepts ^1.14, so both resolve. Tests only.
rustls = { version = "=0.23.40", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = { workspace = true }
anyhow = "1"
settle-core = { path = "../../crates/settle-core" }
outlayer-job = { path = "../../crates/outlayer-job" }
sha2 = "0.10"
hex = "0.4"
