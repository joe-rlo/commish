# Commish Worker: quick accounts, Test USDC faucet, 1Click dry-run quotes, demo reset.
# Secrets (never in this file): DEMO_ROOT_PRIVATE_KEY, ADMIN_TOKEN, ONECLICK_JWT (optional).
#   wrangler secret put DEMO_ROOT_PRIVATE_KEY
# Local dev reads them from worker/.dev.vars (gitignored).
name = "commish-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEAR_RPC_URL = "https://test.rpc.fastnear.com"
DEMO_ROOT_ACCOUNT_ID = "commishhq.testnet"
COMMISH_CONTRACT_ID = "commish-v2.commishhq.testnet"
MOCK_USDC_CONTRACT_ID = "usdc.commishhq.testnet"
DEMO_SLEEPER_LEAGUE_ID = "1197787383500648448"
ALLOWED_ORIGINS = "https://commish-2o8.pages.dev"

# Rate-limit counters (namespace "RATE" on the Commish Cloudflare account).
[[kv_namespaces]]
binding = "RATE"
id = "d4ab1401cf5b4ea2978763ac175ee94e"
